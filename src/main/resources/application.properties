spring.application.name=wikitaller

# Base de datos H2 local. Los datos se guardan en la carpeta data/.
spring.datasource.url=jdbc:h2:file:./data/devwiki;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creará o actualizará las tablas cuando existan entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola disponible solo durante el desarrollo local.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
